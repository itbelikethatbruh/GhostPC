name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with cache and wrapper validation)
        uses: gradle/actions/setup-gradle@v4

      - name: Use your own signing key if configured
        env:
          KEYSTORE_B64: ${{ secrets.RADIANT_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RADIANT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RADIANT_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RADIANT_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/radiant.jks"
            {
              echo "RADIANT_KEYSTORE_FILE=$RUNNER_TEMP/radiant.jks"
              echo "RADIANT_KEYSTORE_PASSWORD=$KS_PASS"
              echo "RADIANT_KEY_ALIAS=$KEY_ALIAS"
              echo "RADIANT_KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
            echo "Signing with the key from repository secrets."
          else
            echo "Signing with keystore/radiant-shared.jks (see README to use your own key)."
          fi

      - name: Build release and debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/RadiantPCGameBrowser-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/RadiantPCGameBrowser-${{ github.run_number }}-debug.apk"
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadiantPCGameBrowser-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

  # Installs the release APK on an Android emulator and uses it like a player would. A build that
  # crashes here is never published. Screenshots and logs are kept as the smoke-test artifact.
  smoke:
    name: Launch test on an Android emulator
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download the APKs
        uses: actions/download-artifact@v4
        with:
          name: RadiantPCGameBrowser-${{ github.run_number }}
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/smoke-test.sh "dist/RadiantPCGameBrowser-${{ github.run_number }}.apk" smoke

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-${{ github.run_number }}
          path: smoke/
          if-no-files-found: warn

      # Same files on the ci-smoke branch, readable without downloading the artifact zip.
      - name: Publish screenshots to the ci-smoke branch
        if: always() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -d smoke ] || exit 0
          cd smoke
          [ -f logcat.txt ] && tail -n 20000 logcat.txt > logcat.tmp && mv logcat.tmp logcat.txt
          git init -q
          git checkout -q -b ci-smoke
          git add -A
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Launch test for run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" ci-smoke

  # On the default branch (or a v* tag) the APK is also attached to a GitHub Release,
  # which is the easiest place to download it from a phone.
  release:
    name: Publish release
    needs: [build, smoke]
    if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest

    steps:
      - name: Download the APKs
        uses: actions/download-artifact@v4
        with:
          name: RadiantPCGameBrowser-${{ github.run_number }}
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Radiant PC Game Browser build ${{ github.run_number }}
          body: |
            Install `RadiantPCGameBrowser-${{ github.run_number }}.apk` on your phone or tablet.
            The `-debug` APK installs side by side and enables chrome://inspect debugging over USB.
            This build passed the launch test on an Android emulator before it was published.
          files: dist/*.apk
          make_latest: true
